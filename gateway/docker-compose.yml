services:
  ccp-gateway:
    build: .
    image: ccp-gateway:dev
    container_name: ccp-gateway
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      CCP_GATEWAY_HOST: ${CCP_GATEWAY_HOST:-0.0.0.0}
      CCP_GATEWAY_CONTAINER_LOOPBACK: "${CCP_GATEWAY_CONTAINER_LOOPBACK:-1}"
      CCP_GATEWAY_PORT: "${CCP_GATEWAY_PORT:-8787}"
      CCP_CACHE_DIR: /data
      CCP_DB_PATH: /data/ccp.db
      CCP_ALLOWED_HOSTS: ${CCP_ALLOWED_HOSTS:-127.0.0.1,localhost,192.168.20.100}
      CCP_EXECUTION_KEY_ID: ${CCP_EXECUTION_KEY_ID:-}
      CCP_ALLOW_MEMORY_SIGNER: ${CCP_ALLOW_MEMORY_SIGNER:-}
      CCP_EXECUTION_PRIVATE_KEY_PKCS8: ${CCP_EXECUTION_PRIVATE_KEY_PKCS8:-}
      CCP_SIGNER_SOCKET: ${CCP_SIGNER_SOCKET:-}
      CCP_RELEASE_TARGETS_KEY_ID: ${CCP_RELEASE_TARGETS_KEY_ID:-release-targets}
      CCP_RELEASE_TARGETS_PUBLIC_KEY_PEM: ${CCP_RELEASE_TARGETS_PUBLIC_KEY_PEM:-}
      CCP_RELEASE_POLICY_KEY_ID: ${CCP_RELEASE_POLICY_KEY_ID:-rollout-policy}
      CCP_RELEASE_POLICY_PUBLIC_KEY_PEM: ${CCP_RELEASE_POLICY_PUBLIC_KEY_PEM:-}
      CCP_RELEASE_TARGETS_THRESHOLD: ${CCP_RELEASE_TARGETS_THRESHOLD:-1}
      CCP_RELEASE_POLICY_THRESHOLD: ${CCP_RELEASE_POLICY_THRESHOLD:-1}
      DTX_MEMBER_JWT_ISSUER: ${DTX_MEMBER_JWT_ISSUER:-mcpdocs}
      DTX_MEMBER_JWT_PUBLIC_KEY_PATH: /run/secrets/member-jwt-public.pem
    ports:
      - "127.0.0.1:${CCP_GATEWAY_PUBLISH_PORT:-8787}:${CCP_GATEWAY_PORT:-8787}"
    volumes:
      - ccp-data:/data
      - signer-sock:/run/ccp
      - ${USERPROFILE}/.ccp/member-jwt-public.pem:/run/secrets/member-jwt-public.pem:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch(`http://127.0.0.1:${CCP_GATEWAY_PORT:-8787}/ccp/v1/health`).then(async(r)=>{const b=await r.json().catch(()=>null);process.exit(r.ok&&b?.ok===true&&b?.signer==='configured'?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Production signing: private key stays in this process, not in the Gateway.
  #   docker compose --profile signer up -d
  # Requires CCP_SIGNER_PRIVATE_KEY_PATH on the host (PEM Ed25519).
  ccp-signer:
    profiles: ["signer"]
    image: ccp-gateway:dev
    build: .
    container_name: ccp-signer
    restart: unless-stopped
    init: true
    environment:
      CCP_SIGNER_SOCKET: /run/ccp/signer.sock
      CCP_EXECUTION_KEY_ID: ${CCP_EXECUTION_KEY_ID:-execution-dev-1}
      CCP_SIGNER_PRIVATE_KEY_PATH: /run/secrets/execution-private.pem
    volumes:
      - signer-sock:/run/ccp
      - ./secrets/execution-private.pem:/run/secrets/execution-private.pem:ro
    entrypoint: ["/usr/bin/dumb-init", "--"]
    command:
      - /bin/sh
      - -c
      - mkdir -p /run/ccp && chown node:node /run/ccp && su-exec node yarn signer:start

volumes:
  ccp-data:
  signer-sock:
